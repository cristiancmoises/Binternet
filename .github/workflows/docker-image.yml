name: Docker Image CI
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Least privilege: the workflow only checks out code and pushes an image.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

    # Lowercase owner/repo in shell instead of a third-party action.
    - id: ref
      run: |
        echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
        echo "repo=${REPO_NAME,,}" >> "$GITHUB_OUTPUT"
      env:
        REPO_NAME: ${{ github.event.repository.name }}

    - uses: docker/build-push-action@v6
      with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.ref.outputs.owner }}/${{ steps.ref.outputs.repo }}:latest
