server {
    listen 8080 default_server;
    server_name _;
    root /var/www/binternet;
    index index.php;
    server_tokens off;
    client_max_body_size 16k;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location = / { rewrite ^ /index.php last; }
    location = /source.tar.gz {
        limit_except GET HEAD { deny all; }
        types { application/gzip gz; }
        try_files $uri =404;
    }
    location = /static/infinite-scroll.js {
        limit_except GET HEAD { deny all; }
        types { application/javascript js; }
        try_files $uri =404;
        expires 1h;
    }
    location ~ ^/(index|search|image_proxy|donate|health)\.php$ {
        limit_req zone=search_budget burst=30 nodelay;
        limit_req zone=image_budget burst=200 nodelay;
        limit_req_status 429;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 25s;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ ^/misc/[a-zA-Z0-9_-]+\.(css|png|jpg|jpeg|webp|gif|svg|ico)$ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires 1h;
    }
    location ~ ^/static/(img/)?[a-zA-Z0-9_-]+\.(css|png|jpg|jpeg|webp|gif|svg|ico)$ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires 1h;
    }
    location / { return 404; }
}
