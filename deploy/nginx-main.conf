worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    # No forwarded IP is trusted by default. Behind NPM these budgets apply
    # to its aggregate traffic; health/static requests have empty keys.
    map $uri $binternet_search_key {
        default "";
        /search.php $binary_remote_addr;
    }
    map $uri $binternet_image_key {
        default "";
        /image_proxy.php $binary_remote_addr;
    }
    limit_req_zone $binternet_search_key zone=search_budget:1m rate=5r/s;
    limit_req_zone $binternet_image_key zone=image_budget:1m rate=50r/s;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Exclude queries: image URLs and search terms are private.
    log_format private '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout private;
    sendfile on;
    keepalive_timeout 30;
    client_body_timeout 10;
    client_header_timeout 10;
    # A 4096-byte opaque cursor can expand to 12 KiB when URL-encoded.
    large_client_header_buffers 4 16k;
    send_timeout 20;
    client_body_temp_path /var/cache/nginx/client_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    # Nginx initializes these module paths even when no location uses them.
    # Alpine's defaults live under /var/lib/nginx, outside the writable tmpfs.
    proxy_temp_path /var/cache/nginx/proxy_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/json image/svg+xml;
    include /etc/nginx/http.d/*.conf;
}
