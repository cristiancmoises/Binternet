server {
    listen       8080 default_server;
    server_name  _;

    root     /var/www/binternet;
    index    index.php;

    # Security headers. The app ships no JavaScript, so script-src can be
    # fully disabled; inline styles are used in a couple of templates.
    add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;

    # Never serve the PHP partials in misc/ directly.
    location ^~ /misc/ {
        location ~ \.php$ { deny all; }
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php-fpm83.sock;
        fastcgi_index  index.php;
        fastcgi_param  PATH_INFO $path_info;
        fastcgi_param  SCRIPT_FILENAME    $document_root$fastcgi_script_name;

        fastcgi_split_path_info         ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name  =404;
        set $path_info                  $fastcgi_path_info;

        include        fastcgi_params;
    }
}
